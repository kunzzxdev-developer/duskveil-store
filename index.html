<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DuskVeilSMP — Official Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="particles" id="particles"></div>
    <div class="bg-gradient-mesh"></div>

    <!-- Navbar (sama seperti sebelumnya) -->
    <nav id="navbar" class="hidden">
        <div class="nav-inner">
            <div class="logo" onclick="ui.showStorePanel()" style="cursor:pointer">
                <span class="logo-dusk">DUSK</span><span class="logo-veil">VEIL</span><span class="logo-smp">SMP</span>
            </div>
            <div class="nav-items">
                <div class="user-info">
                    <div class="user-avatar" id="nav-avatar">?</div>
                    <span id="nav-username" class="nav-username">Member</span>
                    <div class="coin-badge">
                        <span class="coin-icon">✦</span>
                        <span id="nav-coin">0</span>
                    </div>
                </div>
                <button id="nav-commands-btn" class="btn-nav-cmd hidden" onclick="ui.showCommandPanel()">
                    <span>⌨</span> Commands
                    <span id="pending-badge" class="pending-badge" style="display:none">0</span>
                </button>
                <button id="nav-purchases-btn" class="btn-nav-cmd hidden" onclick="ui.showPurchasePanel()" style="background: linear-gradient(135deg, #059669, #10b981);">
                    <span>📋</span> Riwayat
                </button>
                <button id="nav-admin-btn" class="btn-nav-cmd hidden" onclick="ui.showAdminPanel()" style="background: linear-gradient(135deg, #dc2626, #ef4444);">
                    <span>🛡</span> Admin
                </button>
                <button class="btn-logout" onclick="app.logout()">
                    <span>↩</span> Logout
                </button>
            </div>
        </div>
    </nav>

    <main>
        <!-- AUTH SECTION - Tanpa Turnstile -->
        <section id="auth-section" class="fade-in">
            <div class="auth-wrapper">
                <div class="auth-deco-left"></div>
                <div class="auth-deco-right"></div>
                <div class="auth-card">
                    <div class="auth-logo-area">
                        <div class="auth-emblem">⚔</div>
                        <h1 class="auth-title">DUSKVEIL<span>SMP</span></h1>
                        <p class="auth-subtitle">Official Member Store</p>
                    </div>
                    <div class="tabs">
                        <button class="tab-btn active" onclick="ui.switchTab('login')">Masuk</button>
                        <button class="tab-btn" onclick="ui.switchTab('register')">Daftar</button>
                        <div class="tab-indicator" id="tab-indicator"></div>
                    </div>
                    
                    <!-- FORM LOGIN - Tanpa Turnstile -->
                    <form id="form-login" onsubmit="app.handleLogin(event)">
                        <div class="input-group">
                            <label for="login-user">Username Minecraft</label>
                            <div class="input-wrap">
                                <span class="input-icon">◈</span>
                                <input type="text" id="login-user" required placeholder="Username Minecraft anda" minlength="3" maxlength="16" pattern="[a-zA-Z0-9_]+">
                            </div>
                        </div>
                        <div class="input-group">
                            <label for="login-pass">Password</label>
                            <div class="input-wrap">
                                <span class="input-icon">◉</span>
                                <input type="password" id="login-pass" required placeholder="Password anda" minlength="6">
                            </div>
                        </div>
                        <button type="submit" class="btn-primary" id="login-btn">
                            <span class="btn-text">MASUK SERVER</span>
                            <span class="btn-arrow">→</span>
                        </button>
                    </form>
                    
                    <!-- FORM REGISTER - Tanpa Turnstile -->
                    <form id="form-register" class="hidden" onsubmit="app.handleRegister(event)">
                        <div class="input-group">
                            <label for="reg-user">Username Minecraft Baru</label>
                            <div class="input-wrap">
                                <span class="input-icon">◈</span>
                                <input type="text" id="reg-user" required placeholder="Buat username anda" minlength="3" maxlength="16" pattern="[a-zA-Z0-9_]+">
                            </div>
                        </div>
                        <div class="input-group">
                            <label for="reg-pass">Password</label>
                            <div class="input-wrap">
                                <span class="input-icon">◉</span>
                                <input type="password" id="reg-pass" required placeholder="Buat password anda" minlength="6">
                            </div>
                        </div>
                        <div class="input-group">
                            <label for="reg-pass-confirm">Konfirmasi Password</label>
                            <div class="input-wrap">
                                <span class="input-icon">◉</span>
                                <input type="password" id="reg-pass-confirm" required placeholder="Ulangi password">
                            </div>
                        </div>
                        <button type="submit" class="btn-primary" id="register-btn">
                            <span class="btn-text">DAFTAR SEKARANG</span>
                            <span class="btn-arrow">→</span>
                        </button>
                    </form>
                </div>
            </div>
        </section>

        <!-- STORE SECTION, ADMIN DASHBOARD, COMMAND PANEL, PURCHASE PANEL -->
        <!-- (Sama seperti sebelumnya, tidak ada perubahan) -->
        <section id="store-section" class="hidden fade-in">
            <!-- ... konten store sama seperti sebelumnya ... -->
        </section>

        <section id="admin-dashboard" class="hidden fade-in">
            <!-- ... konten admin sama seperti sebelumnya ... -->
        </section>

        <section id="purchase-panel" class="hidden fade-in">
            <!-- ... konten purchase sama seperti sebelumnya ... -->
        </section>

        <section id="command-panel" class="hidden fade-in">
            <!-- ... konten command sama seperti sebelumnya ... -->
        </section>
    </main>

    <div id="skill-modal" class="modal hidden">
        <!-- ... modal skill sama seperti sebelumnya ... -->
    </div>

    <div id="toast-box"></div>

    <script type="module" src="script.js"></script>
</body>
</html>
